name: Build Docker image

on:
  push:
    branches: [main, codex/prebuilt-image]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '*.sh'
      - 'tests/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check deployment scripts
        run: |
          bash -n install.sh build.sh deploy.sh deploy_cron.sh scripts/image.sh
          python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tag=preview
          if [ "$GITHUB_REF" = refs/heads/main ]; then tag=latest; fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build image before publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./app
          platforms: linux/amd64
          load: true
          tags: ctyun-auto-test:ci
          build-args: APT_MIRROR=deb.debian.org
          cache-from: type=gha

      - name: Check image dependencies without logging in to Ctyun
        run: |
          docker run --rm --entrypoint /bin/bash ctyun-auto-test:ci -ec '
            bash -n /app/entrypoint.sh
            python3 -c "import DrissionPage, ddddocr"
            command -v chromium
            command -v cron
            command -v dotnet
          '

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          build-args: APT_MIRROR=deb.debian.org
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish instructions
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Image: $IMAGE:$IMAGE_TAG"
            echo "Digest: $IMAGE@$DIGEST"
            echo 'First publication: set the package visibility to Public in GitHub Packages to allow anonymous pulls.'
          } >> "$GITHUB_STEP_SUMMARY"
